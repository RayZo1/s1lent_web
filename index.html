<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ace</title>
  <meta name="description" content="ace authentication.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0c0c0c;
    }

    .login-wrap {
      width: 100%;
      max-width: 340px;
      padding: 1.5rem;
      animation: fadeUp 0.3s ease forwards;
    }



    .login-card {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
    }

    .login-heading {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-1);
      margin-bottom: 0.25rem;
    }
    .login-sub {
      font-size: 0.78rem;
      color: var(--text-3);
      margin-bottom: 1.5rem;
    }

    /* Terminal input row */
    .term-row {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      padding: 0 12px;
      transition: border-color 0.15s;
    }
    .term-row:focus-within { border-color: var(--line-hi); }
    .term-row.err {
      border-color: var(--red);
      animation: shake 0.35s ease;
    }
    .term-row.ok { border-color: var(--green); }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%  { transform: translateX(-4px); }
      40%  { transform: translateX(4px); }
      60%  { transform: translateX(-3px); }
      80%  { transform: translateX(3px); }
    }

    .term-prefix {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-3);
      white-space: nowrap;
      user-select: none;
      padding: 13px 8px 13px 0;
      flex-shrink: 0;
    }

    .term-caret {
      width: 5px; height: 13px;
      background: var(--text-3);
      border-radius: 1px;
      margin-right: 6px;
      flex-shrink: 0;
      animation: blink 1s step-end infinite;
    }
    .term-row:focus-within .term-caret { opacity: 0; }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

    #licenseKey {
      flex: 1;
      min-width: 0;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      font-family: var(--mono) !important;
      font-size: 0.85rem !important;
      color: var(--text-1) !important;
      padding: 13px 0 !important;
      letter-spacing: 0.12em !important;
      -webkit-text-security: disc;
      caret-color: var(--text-2);
      width: 100% !important;
    }
    #licenseKey::placeholder {
      color: var(--text-4);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      -webkit-text-security: none;
    }
    #licenseKey[type="password"] { letter-spacing: 0.18em !important; }

    .char-count {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--text-4);
      flex-shrink: 0;
      padding-left: 8px;
    }

    .auth-status {
      font-family: var(--mono);
      font-size: 0.68rem;
      min-height: 1em;
      margin-top: 0.45rem;
      padding-left: 1px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .auth-status.visible { opacity: 1; }
    .auth-status.ok   { color: var(--green); }
    .auth-status.err  { color: var(--red);   }
    .auth-status.info { color: var(--text-3); }

    #loginBtn {
      width: 100%;
      margin-top: 1rem;
      padding: 11px 16px;
      background: var(--text-1);
      color: var(--bg);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s;
      letter-spacing: -0.01em;
    }
    #loginBtn:hover { background: #e0e0e0; }
    #loginBtn:active { background: #cacaca; }
    #loginBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    #loginBtn.loading .btn-label { opacity: 0.5; }
    #loginBtn.loading .btn-arrow { display: none; }

    .btn-spin {
      width: 12px; height: 12px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    #loginBtn.loading .btn-spin { display: block; }

    .login-footer {
      margin-top: 1.25rem;
      text-align: center;
    }
    .login-footer a {
      font-size: 0.76rem;
      color: var(--text-4);
      text-decoration: none;
      transition: color 0.15s;
    }
    .login-footer a:hover { color: var(--text-2); }
  </style>
</head>
<body>

<div id="toast-container"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-heading">Sign in</div>
    <div class="login-sub">Enter your license key to continue</div>

    <div class="term-row" id="termRow" style="padding-left: 12px; padding-right: 12px;">
      <input
        type="password"
        id="licenseKey"
        placeholder="license key"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="License key"
        maxlength="80"
      >
    </div>

    <div class="auth-status" id="authStatus"></div>

    <button id="loginBtn" type="button" onclick="doLogin()">
      <div class="btn-spin"></div>
      <span class="btn-label">Continue</span>
      <span class="btn-arrow">→</span>
    </button>

    <div class="login-footer">
      <a href="https://discord.gg/F6GVM27vTm" target="_blank" rel="noopener">Need a key? Discord ↗</a>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  var inputEl  = document.getElementById('licenseKey');
  var rowEl    = document.getElementById('termRow');
  var statusEl = document.getElementById('authStatus');
  var loginBtn = document.getElementById('loginBtn');

  inputEl.addEventListener('input', function() {
    setStatus('', '');
    rowEl.classList.remove('err', 'ok');
  });
  inputEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'auth-status' + (msg ? ' visible ' + type : '');
  }
  function resetInput() {
    inputEl.value = '';
    rowEl.classList.remove('err', 'ok');
  }

  async function doLogin() {
    var key = inputEl.value.trim();
    if (!key) {
      rowEl.classList.add('err');
      setStatus('[!] key cannot be empty.', 'err');
      setTimeout(function() { rowEl.classList.remove('err'); setStatus('',''); }, 2000);
      inputEl.focus();
      return;
    }

    loginBtn.disabled = true;
    loginBtn.classList.add('loading');
    setStatus('[~] verifying...', 'info');

    var res = await apiCall('/web/login', 'POST', { license: key });

    loginBtn.disabled = false;
    loginBtn.classList.remove('loading');

    if (res.status === 'pairing_required') {
      var pairCode = res.code || '????';
      loginBtn.disabled = true;
      setStatus('[~] waiting for discord link — code: ' + pairCode, 'info');
      showToast('Run !link in the server and enter: ' + pairCode, 'info', 12000);
      var pollInterval = setInterval(async function() {
        var pollRes = await apiCall('/login_check?auth_id=' + encodeURIComponent(res.auth_id));
        if (pollRes.status === 'success') {
          clearInterval(pollInterval);
          rowEl.classList.add('ok');
          setStatus('[+] linked! redirecting...', 'ok');
          setToken(pollRes.token);
          setTimeout(function() {
            window.location.href = pollRes.role === 'admin' ? 'admin.html' : 'panel.html';
          }, 900);
        } else if (pollRes.status === 'denied' || pollRes.status === 'error') {
          clearInterval(pollInterval);
          rowEl.classList.add('err');
          setStatus('[!] ' + (pollRes.message || 'link failed.'), 'err');
          loginBtn.disabled = false;
          setTimeout(function() { rowEl.classList.remove('err'); resetInput(); }, 2200);
        }
      }, 2000);
      setTimeout(function() {
        clearInterval(pollInterval);
        if (loginBtn.disabled) {
          rowEl.classList.add('err');
          setStatus('[!] link timed out.', 'err');
          loginBtn.disabled = false;
          setTimeout(function() { rowEl.classList.remove('err'); resetInput(); }, 2200);
        }
      }, 300000);

    } else if (res.status === '2fa_required') {
      loginBtn.disabled = true;
      setStatus('[~] waiting for discord 2fa...', 'info');
      showToast('Check your Discord DMs to approve.', 'info', 8000);
      var poll2 = setInterval(async function() {
        var pollRes = await apiCall('/login_check?auth_id=' + encodeURIComponent(res.auth_id));
        if (pollRes.status === 'success') {
          clearInterval(poll2);
          rowEl.classList.add('ok');
          setStatus('[+] confirmed! redirecting...', 'ok');
          setToken(pollRes.token);
          setTimeout(function() {
            window.location.href = pollRes.admin ? 'admin.html' : 'panel.html';
          }, 900);
        } else if (pollRes.status === 'denied' || pollRes.status === 'error') {
          clearInterval(poll2);
          rowEl.classList.add('err');
          setStatus('[!] ' + (pollRes.message || '2fa denied.'), 'err');
          loginBtn.disabled = false;
          setTimeout(function() { rowEl.classList.remove('err'); resetInput(); }, 2200);
        }
      }, 2000);

    } else if (res.status === 'success' || res.success === true) {
      rowEl.classList.add('ok');
      setStatus('[+] authenticated. redirecting...', 'ok');
      setToken(res.token);
      setTimeout(function() {
        window.location.href = res.admin ? 'admin.html' : 'panel.html';
      }, 800);

    } else {
      rowEl.classList.add('err');
      setStatus('[!] ' + (res.message || 'invalid license key.'), 'err');
      showToast(res.message || 'Invalid license key.', 'error');
      setTimeout(function() {
        rowEl.classList.remove('err');
        resetInput();
        inputEl.focus();
      }, 1800);
    }
  }
</script>
</body>
</html>
