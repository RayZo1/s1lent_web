<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ace — Authentication</title>
  <meta name="description" content="Ace client authentication portal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: var(--bg-void);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Animated background */
    .login-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .login-bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
    }
    .orb-1 {
      width: 550px; height: 550px;
      background: radial-gradient(circle, rgba(59,130,246,0.13) 0%, transparent 70%);
      top: -200px; right: -150px;
      animation: orbDrift1 14s ease-in-out infinite;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(124,58,237,0.10) 0%, transparent 70%);
      bottom: -150px; left: -100px;
      animation: orbDrift2 18s ease-in-out infinite;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(59,130,246,0.07) 0%, transparent 70%);
      bottom: 20%; right: 10%;
      animation: orbDrift3 22s ease-in-out infinite;
    }
    @keyframes orbDrift1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33%  { transform: translate(-30px, 40px) scale(1.06); }
      66%  { transform: translate(20px, -20px) scale(0.95); }
    }
    @keyframes orbDrift2 {
      0%,100% { transform: translate(0,0) scale(1); }
      40%  { transform: translate(35px, -30px) scale(1.08); }
      70%  { transform: translate(-15px, 20px) scale(0.97); }
    }
    @keyframes orbDrift3 {
      0%,100% { transform: translate(0,0); }
      50%  { transform: translate(-25px, 35px); }
    }

    /* Noise grain overlay */
    .login-bg::after {
      content: '';
      position: absolute;
      inset: -50%;
      width: 200%; height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.3;
      pointer-events: none;
      animation: grainShift 8s steps(1) infinite;
    }
    @keyframes grainShift {
      0%   { transform: translate(0,0); }
      12%  { transform: translate(-2%,-3%); }
      24%  { transform: translate(3%,1%); }
      36%  { transform: translate(-1%,4%); }
      48%  { transform: translate(4%,-2%); }
      60%  { transform: translate(-3%,2%); }
      72%  { transform: translate(2%,-4%); }
      84%  { transform: translate(-4%,1%); }
      100% { transform: translate(0,0); }
    }

    /* Grid lines */
    .login-bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, #000 40%, transparent 100%);
    }

    /* Card */
    .auth-scene {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 1.5rem;
    }

    .auth-card {
      background: rgba(10,10,20,0.88);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 2.75rem 2.25rem 2.25rem;
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.05),
        0 32px 80px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      animation: cardReveal 0.55s cubic-bezier(0.16,1,0.3,1) forwards;
      opacity: 0;
    }
    @keyframes cardReveal {
      from { opacity:0; transform: translateY(18px) scale(0.96); }
      to   { opacity:1; transform: none; }
    }

    /* Logo mark */
    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.75rem;
    }
    .logo-ring {
      position: relative;
      width: 52px; height: 52px;
    }
    .logo-inner {
      width: 52px; height: 52px;
      background: var(--gradient-brand);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 8px 24px rgba(59,130,246,0.5);
      animation: logoPulse 3.5s ease-in-out infinite;
    }
    .logo-inner svg { width: 22px; height: 22px; fill: white; }
    @keyframes logoPulse {
      0%,100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 8px 24px rgba(59,130,246,0.4); }
      50%      { box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 8px 32px rgba(59,130,246,0.65), 0 0 60px rgba(59,130,246,0.2); }
    }

    .auth-heading {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-1);
      text-align: center;
      letter-spacing: -0.04em;
      margin-bottom: 0.3rem;
    }
    .auth-sub {
      font-size: 0.82rem;
      color: var(--text-3);
      text-align: center;
      letter-spacing: 0.01em;
      margin-bottom: 2.25rem;
    }

    /* Terminal input */
    .term-wrap {
      background: rgba(5,5,14,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 0;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      position: relative;
      overflow: hidden;
    }
    /* shimmer sweep */
    .term-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,0.05), transparent);
      transform: translateX(-100%);
    }
    .term-wrap:focus-within::before {
      animation: shimmerSweep 0.6s ease forwards;
    }
    @keyframes shimmerSweep {
      to { transform: translateX(100%); }
    }
    .term-wrap:focus-within {
      border-color: rgba(59,130,246,0.5);
      background: rgba(8,8,20,0.95);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12), 0 0 24px rgba(59,130,246,0.08);
    }
    .term-wrap.state-error {
      border-color: rgba(239,68,68,0.5) !important;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.12) !important;
      animation: shake 0.4s cubic-bezier(0.36,0.07,0.19,0.97);
    }
    .term-wrap.state-success {
      border-color: rgba(16,185,129,0.5) !important;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.12) !important;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15%  { transform: translateX(-5px); }
      30%  { transform: translateX(5px); }
      45%  { transform: translateX(-4px); }
      60%  { transform: translateX(4px); }
      75%  { transform: translateX(-2px); }
      90%  { transform: translateX(2px); }
    }

    .term-prefix {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--blue);
      white-space: nowrap;
      user-select: none;
      padding: 16px 8px 16px 0;
      flex-shrink: 0;
      letter-spacing: 0.01em;
    }

    /* blinking caret */
    .term-caret {
      width: 6px; height: 14px;
      background: var(--blue);
      border-radius: 1px;
      margin-right: 8px;
      flex-shrink: 0;
      animation: blink 1.1s step-end infinite;
      opacity: 0.8;
      transition: opacity 0.15s;
    }
    .term-wrap:focus-within .term-caret { opacity: 0; }
    @keyframes blink {
      0%,100% { opacity: 0.8; }
      50%      { opacity: 0; }
    }

    #licenseKey {
      flex: 1;
      min-width: 0;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      font-family: var(--font-mono) !important;
      font-size: 0.9rem !important;
      color: var(--text-1) !important;
      padding: 16px 0 !important;
      letter-spacing: 0.14em !important;
      -webkit-text-security: disc;
      caret-color: var(--blue);
      width: 100% !important;
      transform: none !important;
    }
    #licenseKey::placeholder {
      color: var(--text-4);
      letter-spacing: 0.04em;
      font-size: 0.8rem;
      -webkit-text-security: none;
    }
    #licenseKey[type="password"] { letter-spacing: 0.2em !important; }

    .char-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-4);
      padding-left: 8px;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .term-wrap:focus-within .char-badge { color: var(--text-3); }

    /* Status */
    .auth-status {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      min-height: 1.1em;
      margin-top: 0.5rem;
      padding-left: 2px;
      letter-spacing: 0.02em;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .auth-status.visible { opacity: 1; }
    .auth-status.ok   { color: var(--green); }
    .auth-status.err  { color: var(--red);   }
    .auth-status.info { color: var(--blue);  }

    /* Login button */
    #loginBtn {
      width: 100%;
      margin-top: 1.1rem;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 60%, #6d28d9 100%);
      background-size: 200% 200%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(37,99,235,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: -0.01em;
    }
    #loginBtn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.09) 0%, transparent 60%);
      pointer-events: none;
    }
    #loginBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(37,99,235,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
      filter: brightness(1.08);
    }
    #loginBtn:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(37,99,235,0.25);
    }
    #loginBtn:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }
    #loginBtn.loading .btn-label { opacity: 0.55; }
    #loginBtn.loading .btn-arrow { display: none; }

    .btn-spin {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      display: none;
    }
    #loginBtn.loading .btn-spin { display: block; }

    /* Footer */
    .auth-footer {
      margin-top: 1.75rem;
      text-align: center;
    }
    .auth-footer a {
      font-size: 0.78rem;
      color: var(--text-4);
      text-decoration: none;
      transition: color 0.2s;
      letter-spacing: 0.01em;
    }
    .auth-footer a:hover { color: var(--text-2); }

    /* Version tag */
    .version-tag {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-4);
      letter-spacing: 0.06em;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="login-bg">
    <div class="login-bg-grid"></div>
    <div class="login-bg-orb orb-1"></div>
    <div class="login-bg-orb orb-2"></div>
    <div class="login-bg-orb orb-3"></div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <!-- Card -->
  <div class="auth-scene">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="logo-ring">
          <div class="logo-inner">
            <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          </div>
        </div>
      </div>

      <h1 class="auth-heading">Ace</h1>
      <p class="auth-sub">Enter your license key to continue</p>

      <div class="term-wrap" id="termWrap">
        <span class="term-prefix">[?] License:</span>
        <span class="term-caret" id="termCaret"></span>
        <input
          type="password"
          id="licenseKey"
          placeholder="••••••••••••••••"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="License key"
          maxlength="80"
        >
        <span class="char-badge" id="charBadge">0</span>
      </div>

      <div class="auth-status" id="authStatus"></div>

      <button id="loginBtn" type="button" onclick="doLogin()">
        <div class="btn-spin"></div>
        <span class="btn-label">Authenticate</span>
        <span class="btn-arrow">→</span>
      </button>

      <div class="auth-footer">
        <a href="https://discord.gg/F6GVM27vTm" target="_blank" rel="noopener">
          Need a key? Join the Discord ↗
        </a>
      </div>

    </div>
  </div>

  <span class="version-tag">ACE v2.0</span>

  <script src="script.js"></script>
  <script>
    const inputEl   = document.getElementById('licenseKey');
    const charBadge = document.getElementById('charBadge');
    const caretEl   = document.getElementById('termCaret');
    const termWrap  = document.getElementById('termWrap');
    const statusEl  = document.getElementById('authStatus');
    const loginBtn  = document.getElementById('loginBtn');

    inputEl.addEventListener('input', () => {
      const len = inputEl.value.length;
      charBadge.textContent = len;
      caretEl.style.display = len > 0 ? 'none' : '';
      setStatus('', '');
      termWrap.classList.remove('state-error', 'state-success');
    });
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'auth-status' + (msg ? ' visible ' + type : '');
    }
    function resetInput() {
      inputEl.value = '';
      charBadge.textContent = '0';
      caretEl.style.display = '';
      termWrap.classList.remove('state-error', 'state-success');
    }

    async function doLogin() {
      const key = inputEl.value.trim();
      if (!key) {
        termWrap.classList.add('state-error');
        setStatus('[!] License key cannot be empty.', 'err');
        setTimeout(() => { termWrap.classList.remove('state-error'); setStatus('',''); }, 2200);
        inputEl.focus();
        return;
      }

      loginBtn.disabled = true;
      loginBtn.classList.add('loading');
      setStatus('[~] Verifying...', 'info');

      const res = await apiCall('/login', 'POST', { key });

      loginBtn.disabled = false;
      loginBtn.classList.remove('loading');

      if (res.status === 'pairing_required') {
        const pairCode = res.code || '????';
        loginBtn.disabled = true;
        setStatus(`[~] Waiting for Discord link — code: ${pairCode}`, 'info');
        showToast(`Run !link in the server and enter: ${pairCode}`, 'info', 12000);
        const pollInterval = setInterval(async () => {
          const pollRes = await apiCall(`/login_check?auth_id=${encodeURIComponent(res.auth_id)}`);
          if (pollRes.status === 'success') {
            clearInterval(pollInterval);
            termWrap.classList.add('state-success');
            setStatus('[+] Linked! Redirecting...', 'ok');
            setToken(pollRes.token);
            setTimeout(() => {
              window.location.href = pollRes.role === 'admin' ? 'admin.html' : 'panel.html';
            }, 900);
          } else if (pollRes.status === 'denied' || pollRes.status === 'error') {
            clearInterval(pollInterval);
            termWrap.classList.add('state-error');
            setStatus(`[!] ${pollRes.message || 'Link failed.'}`, 'err');
            showToast(pollRes.message || 'Link failed', 'error');
            loginBtn.disabled = false;
            setTimeout(() => { termWrap.classList.remove('state-error'); resetInput(); }, 2200);
          }
        }, 2000);
        setTimeout(() => {
          clearInterval(pollInterval);
          if (loginBtn.disabled) {
            termWrap.classList.add('state-error');
            setStatus('[!] Link timed out. Try again.', 'err');
            loginBtn.disabled = false;
            setTimeout(() => { termWrap.classList.remove('state-error'); resetInput(); }, 2200);
          }
        }, 300000);

      } else if (res.status === '2fa_required') {
        loginBtn.disabled = true;
        setStatus('[~] Waiting for Discord 2FA...', 'info');
        showToast('Check your Discord DMs to approve the login.', 'info', 8000);
        const pollInterval = setInterval(async () => {
          const pollRes = await apiCall(`/login_check?auth_id=${encodeURIComponent(res.auth_id)}`);
          if (pollRes.status === 'success') {
            clearInterval(pollInterval);
            termWrap.classList.add('state-success');
            setStatus('[+] 2FA confirmed! Redirecting...', 'ok');
            setToken(pollRes.token);
            setTimeout(() => {
              window.location.href = pollRes.role === 'admin' ? 'admin.html' : 'panel.html';
            }, 900);
          } else if (pollRes.status === 'denied' || pollRes.status === 'error') {
            clearInterval(pollInterval);
            termWrap.classList.add('state-error');
            setStatus(`[!] ${pollRes.message || '2FA denied.'}`, 'err');
            loginBtn.disabled = false;
            setTimeout(() => { termWrap.classList.remove('state-error'); resetInput(); }, 2200);
          }
        }, 2000);
        setTimeout(() => {
          clearInterval(pollInterval);
          if (loginBtn.disabled) {
            termWrap.classList.add('state-error');
            setStatus('[!] 2FA timed out.', 'err');
            loginBtn.disabled = false;
            setTimeout(() => { termWrap.classList.remove('state-error'); resetInput(); }, 2200);
          }
        }, 300000);

      } else if (res.status === 'success' || res.success === true) {
        termWrap.classList.add('state-success');
        setStatus('[+] Authenticated. Redirecting...', 'ok');
        setToken(res.token);
        setTimeout(() => {
          window.location.href = res.role === 'admin' ? 'admin.html' : 'panel.html';
        }, 800);

      } else {
        termWrap.classList.add('state-error');
        setStatus(`[!] ${res.message || 'Invalid license key.'}`, 'err');
        showToast(res.message || 'Invalid license key.', 'error');
        setTimeout(() => {
          termWrap.classList.remove('state-error');
          resetInput();
          inputEl.focus();
        }, 1800);
      }
    }
  </script>
</body>
</html>
