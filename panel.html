<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ace — dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <p>loading...</p>
</div>

<div id="toast-container"></div>

<div class="shell" id="appShell" style="display:none;">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-name">ace</span>
    </div>

    <span class="nav-section-label">Menu</span>

    <button class="nav-item active" onclick="showSection('overview')" id="nav-overview">
      <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Overview
    </button>

    <button class="nav-item" onclick="showSection('account')" id="nav-account">
      <svg class="nav-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Account
    </button>

    <div class="nav-spacer"></div>

    <span class="nav-section-label">Links</span>
    <button class="nav-item" onclick="window.open('https://discord.gg/F6GVM27vTm','_blank')">
      Discord
    </button>

    <div class="divider"></div>

    <button class="nav-item nav-logout" onclick="logout()">
      Sign out
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar-title" id="topbarTitle">overview</span>
      <div class="topbar-spacer"></div>
      <span id="userNameTop" style="font-size:0.78rem;color:var(--text-3);">—</span>
    </header>

    <!-- Overview -->
    <section class="page-content" id="section-overview">
      <div class="page-header">
        <h1 class="page-title">Overview</h1>
        <p class="page-desc" id="welcomeDesc">Your session is active.</p>
      </div>

      <div class="grid-3" style="margin-bottom:1.25rem;">
        <div class="stat-card">
          <span class="stat-label">Status</span>
          <span id="stat-status" style="margin-top:4px;">
            <span class="badge badge-green">active</span>
          </span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Time Left</span>
          <span class="stat-value" style="font-size:1.2rem;" id="stat-expiry">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Discord</span>
          <span class="stat-value" style="font-size:0.85rem;font-weight:500;color:var(--text-2);" id="stat-discord">not linked</span>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="section-header" style="margin-bottom:0.75rem;">
            <div>
              <div class="section-title">Download</div>
              <div class="section-sub">Get the latest loader</div>
            </div>
          </div>
          <button class="btn btn-primary btn-full" onclick="downloadClient()" id="downloadBtn">
            Download
          </button>
        </div>

        <div class="card">
          <div class="section-header" style="margin-bottom:0.75rem;">
            <div>
              <div class="section-title">Community</div>
              <div class="section-sub">Support &amp; updates</div>
            </div>
          </div>
          <a href="https://discord.gg/F6GVM27vTm" target="_blank" rel="noopener" style="text-decoration:none;display:block;">
            <button class="btn btn-ghost btn-full">Discord ↗</button>
          </a>
        </div>
      </div>
    </section>

    <!-- Account -->
    <section class="page-content" id="section-account" style="display:none;">
      <div class="page-header">
        <h1 class="page-title">Account</h1>
        <p class="page-desc">Your license &amp; hardware details</p>
      </div>

      <div class="card">
        <div class="info-row">
          <span class="info-label">License Key</span>
          <span class="info-value info-value-mono sensitive" id="acc-license">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Expires</span>
          <span class="info-value" id="acc-expiry">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">HWID</span>
          <span class="info-value info-value-mono sensitive" id="acc-hwid">not linked</span>
        </div>
        <div class="info-row">
          <span class="info-label">Discord</span>
          <span class="info-value" id="acc-discord">not linked</span>
        </div>
      </div>
    </section>
  </div>

</div>

<script src="script.js"></script>
<script>
  window.addEventListener('load', function() { initPanel(); });

  function showSection(name) {
    document.querySelectorAll('.page-content').forEach(function(s) { s.style.display = 'none'; });
    document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
    var sec = document.getElementById('section-' + name);
    var nav = document.getElementById('nav-' + name);
    if (sec) sec.style.display = 'block';
    if (nav) nav.classList.add('active');
    var titles = { overview: 'overview', account: 'account' };
    document.getElementById('topbarTitle').textContent = titles[name] || name;
  }

  async function initPanel() {
    var token = getToken();
    if (!token) { window.location.href = 'index.html'; return; }
    try {
      var res = await apiCall('/web/me');
      if (!res || res.status === 'error') { clearToken(); window.location.href = 'index.html'; return; }
      populatePanel(res);
    } catch(e) { clearToken(); window.location.href = 'index.html'; }
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'flex';
  }

  function populatePanel(d) {
    var license  = d.license  || '—';
    var expiry   = d.expiry   || null;
    var hwid     = d.hwid     || 'not linked';
    var discord  = d.username || d.discord_id || 'not linked';
    var timeLeft = getTimeRemaining(expiry);

    document.getElementById('userNameTop').textContent  = discord;
    document.getElementById('welcomeDesc').textContent  = 'signed in as ' + discord;
    document.getElementById('stat-expiry').textContent  = timeLeft;
    document.getElementById('stat-discord').textContent = discord;

    if (timeLeft === 'Expired') {
      document.getElementById('stat-status').innerHTML = '<span class="badge badge-red">expired</span>';
    }

    document.getElementById('acc-license').textContent = license;
    document.getElementById('acc-expiry').textContent  = timeLeft;
    document.getElementById('acc-hwid').textContent    = hwid;
    document.getElementById('acc-discord').textContent = discord;
  }

  async function downloadClient() {
    var btn = document.getElementById('downloadBtn');
    btn.disabled = true;
    btn.textContent = 'Fetching...';
    try {
      var res = await fetch(API_URL + '/api/web/download', {
        headers: { 'Authorization': 'Bearer ' + getToken() }
      });
      if (res.ok) {
        var blob = await res.blob();
        var url = window.URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        var cd = res.headers.get('content-disposition');
        var filename = 'loader.zip';
        if (cd && cd.indexOf('filename=') !== -1) {
          filename = cd.split('filename=')[1].replace(/"/g, '');
        }
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast('Download started.', 'success');
      } else {
        showToast('No download available.', 'warning');
      }
    } catch (e) {
      showToast('Failed to fetch download.', 'error');
    }
    btn.disabled = false;
    btn.textContent = 'Download';
  }
</script>
</body>
</html>
